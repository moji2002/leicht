  <h2>A table outside a figure must stay bare</h2>
  <table id="naked">
    <thead><tr><th>One</th><th>Two</th></tr></thead>
    <tbody><tr><td>a</td><td>b</td></tr></tbody>
  </table>

  <h2>A figure that is not a table must stay a figure</h2>
  <figure id="imagefig">
    <img src="/logo/leicht-mark.svg" alt="" width="48" height="48">
    <figcaption>An ordinary image figure</figcaption>
  </figure>
</main>
</body>
</html>
